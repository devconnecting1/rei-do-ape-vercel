<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detalhe — Rei do Apê</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/geist@latest/dist/fonts/geist-sans/style.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',sans-serif;background:#f5f5f5;color:#1a1a1a;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.header{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e0e0e0;background:#fff;position:sticky;top:0;z-index:60}
.header .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:#1a3c6e;text-decoration:none}
.header .logo svg{width:28px;height:28px}
.back-link{font-size:14px;color:#666;display:flex;align-items:center;gap:6px;transition:color .15s}
.back-link:hover{color:#1a1a1a}

.main{max-width:1100px;margin:0 auto;padding:24px;overflow:hidden}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;gap:16px;color:#888}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#1a3c6e;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* GALLERY */
.gallery{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:100%}
.gallery-main{position:relative;aspect-ratio:4/3;background:#e8edf3;overflow:hidden;cursor:zoom-in;max-width:100%}
.gallery-main img{width:100%;height:100%;object-fit:cover;transition:transform .2s;display:block}
.gallery-main img.zoomed{transform:scale(2);cursor:zoom-out}
.gallery-thumbs{display:flex;gap:4px;padding:6px;overflow-x:auto}
.gallery-thumbs img{width:56px;height:40px;object-fit:cover;border-radius:4px;border:2px solid transparent;cursor:pointer;opacity:.7;transition:opacity .15s,border-color .15s}
.gallery-thumbs img.active{border-color:#1a3c6e;opacity:1}
.gallery-thumbs img:hover{opacity:1}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.gallery-nav:hover{background:rgba(0,0,0,.75)}
.gallery-nav.prev{left:8px}
.gallery-nav.next{right:8px}
.gallery-count{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px}

/* GRID */
.content-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;overflow:hidden}
@media(max-width:800px){.content-grid{grid-template-columns:1fr}}

/* LEFT */
.info-section{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.info-section h1{font-size:24px;font-weight:700;line-height:1.3;margin-bottom:6px}
.info-section .address{font-size:14px;color:#888;margin-bottom:4px}
.info-section .developer{font-size:13px;color:#1a3c6e;font-weight:600}
.info-section .status-badge{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:6px;background:#e8f0fe;color:#1a3c6e;margin-top:8px}

.specs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
@media(max-width:600px){.specs-grid{grid-template-columns:repeat(2,1fr)}}
.spec-item{text-align:center;padding:16px 8px;background:#f8f9fb;border-radius:8px}
.spec-item .spec-value{font-size:22px;font-weight:700;color:#1a1a1a}
.spec-item .spec-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* FEATURES */
.features-section{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.features-section h2{font-size:16px;font-weight:700;margin-bottom:16px}
.features-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:600px){.features-grid{grid-template-columns:1fr}}
.feature-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#444;padding:6px 0}
.feature-item svg{width:16px;height:16px;color:#1a3c6e;flex:none}

/* DESCRIPTION */
.desc-section{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.desc-section h2{font-size:16px;font-weight:700;margin-bottom:12px}
.desc-section p{font-size:14px;line-height:1.7;color:#444}

/* RIGHT SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:16px}
.sidebar-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
.sidebar-card .price-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sidebar-card .price-value{font-size:28px;font-weight:700;color:#1a1a1a;margin:4px 0}
.sidebar-card .price-per-m2{font-size:13px;color:#888}
.cta-btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:transform .12s,box-shadow .12s;margin-top:12px}
.cta-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.cta-primary{background:#1a3c6e;color:#fff}
.cta-outline{background:transparent;border:2px solid #e0e0e0;color:#1a1a1a}
.cta-outline:hover{border-color:#1a3c6e}

/* INFO LIST */
.info-list{text-align:left}
.info-list .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.info-list .info-row:last-child{border-bottom:none}
.info-list .info-row .ilabel{color:#888}
.info-list .info-row .ivalue{font-weight:600;color:#1a1a1a}

/* BREADCRUMB */
.breadcrumb{display:flex;align-items:center;gap:6px;padding:10px 0;font-size:12px;color:#888;flex-wrap:wrap}
.breadcrumb a{color:#1a3c6e;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{color:#ccc}

/* COUNTDOWN */
.countdown-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:12px;padding:20px;color:#fff;text-align:center;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.countdown-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:8px}
.countdown-timer{display:flex;justify-content:center;gap:8px}
.countdown-timer .unit{text-align:center}
.countdown-timer .num{font-size:28px;font-weight:700;line-height:1}
.countdown-timer .unit-label{font-size:10px;opacity:.6;margin-top:2px}
.countdown-info{margin-top:12px;font-size:12px;opacity:.7}
.countdown-info strong{color:#4ade80;opacity:1}

/* SHARE */
.share-bar{display:flex;gap:8px;margin:8px 0}
.share-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid #e0e0e0;border-radius:6px;background:#fff;font-size:12px;color:#555;cursor:pointer;transition:all .15s}
.share-btn:hover{border-color:#1a3c6e;color:#1a3c6e}
.share-btn svg{width:14px;height:14px}

/* SECURITY ALERT */
.security-alert{display:flex;align-items:flex-start;gap:12px;padding:16px;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;margin:16px 0;font-size:13px;color:#664d03;line-height:1.5}
.security-alert svg{width:20px;height:20px;color:#ffc107;flex:none;margin-top:2px}

/* CONTACT */
.contact-section{background:#f8f9fb;border-radius:8px;padding:16px;margin:16px 0;font-size:13px;color:#555;line-height:1.5}
.contact-section h3{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.contact-section a{color:#1a3c6e;font-weight:600;text-decoration:none}
.contact-section a:hover{text-decoration:underline}

/* EXPANDABLE */
.expandable{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.expandable-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.expandable-header h2{font-size:16px;font-weight:700;margin:0}
.expandable-arrow{transition:transform .2s;font-size:18px;color:#888}
.expandable-header.open .expandable-arrow{transform:rotate(180deg)}
.expandable-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.expandable-body.open{max-height:2000px}

.footer{text-align:center;padding:40px 20px;color:#888;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#1a3c6e"/><path d="M8 14h4v10H8zM14 10h4v14h-4zM20 6h4v18h-4z" fill="#C9A227"/></svg>
    REI DO APÊ
  </a>
  <a href="catalogo.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar ao Catálogo
  </a>
</div>

<div class="main" id="main">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Carregando empreendimento...</div>
  </div>
</div>

<div class="footer">Rei do Apê — Morar Bem</div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var main = document.getElementById('main');

  if (!id) { showError('ID inválido.'); return; }

  var isCaixa = id.indexOf('cx-') === 0;
  var isSuperbid = id.indexOf('sb-') === 0;
  var apiUrl = isCaixa ? 'api/caixa-detail?id=' + encodeURIComponent(id)
    : isSuperbid ? 'api/superbid-detail?id=' + encodeURIComponent(id.replace('sb-',''))
    : 'api/orulo-detail?id=' + encodeURIComponent(id);

  fetch(apiUrl)
    .then(function(r){ return r.json(); })
    .then(function(b){
      if (b.error) { showError(b.error); return; }
      if (isSuperbid) renderSuperbid(b);
      else render(b);
    })
    .catch(function(e){ showError('Erro ao carregar: ' + e.message); });

  function showError(msg) {
    main.innerHTML = '<div style="text-align:center;padding:80px 20px"><h2>Erro</h2><p style="color:#888;margin:8px 0">' + esc(msg) + '</p><a href="catalogo.html" class="cta-btn cta-outline" style="display:inline-block;width:auto;padding:12px 32px">Voltar ao Catálogo</a></div>';
  }

  function render(b) {
    var imgs = [];
    if (b.images) {
      b.images.forEach(function(img){
        if (typeof img === 'string') { imgs.push(img); return; }
        var url = img['1024x1024'] || img['520x280'] || img['200x140'] || '';
        if (url) imgs.push(url);
      });
    }
    if (!imgs.length && b.default_image) {
      var url = b.default_image['1024x1024'] || b.default_image['520x280'] || '';
      if (url) imgs.push(url);
    }

    var address = '';
    if (b.address) {
      var parts = [];
      if (b.address.street) parts.push(b.address.street + (b.address.number ? ', ' + b.address.number : ''));
      if (b.address.area) parts.push(b.address.area);
      if (b.address.city) parts.push(b.address.city);
      if (b.address.state) parts.push(b.address.state);
      address = parts.join(', ');
    }

    var html = '';

    /* GALLERY */
    if (imgs.length) {
      html += '<div class="gallery" id="gallery">';
      html += '<div class="gallery-main" id="gallery-main">';
      html += '<img id="gallery-img" src="' + esc(imgs[0]) + '" alt="' + esc(b.name) + '">';
      if (imgs.length > 1) {
        html += '<button class="gallery-nav prev" onclick="galleryNav(-1)">&#10094;</button>';
        html += '<button class="gallery-nav next" onclick="galleryNav(1)">&#10095;</button>';
      }
      html += '<div class="gallery-count" id="gallery-count">1/' + imgs.length + '</div>';
      html += '</div>';
      html += '<div class="gallery-thumbs" id="gallery-thumbs">';
      for (var i = 0; i < imgs.length; i++) {
        html += '<img src="' + esc(imgs[i]) + '" data-idx="' + i + '"' + (i === 0 ? ' class="active"' : '') + ' onclick="galleryGo(' + i + ')">';
      }
      html += '</div></div>';
    }

    html += '<div class="content-grid">';

    /* LEFT */
    html += '<div>';
    html += '<div class="info-section">';
    html += '<h1>' + esc(b.name || 'Empreendimento') + '</h1>';
    if (address) html += '<div class="address">' + esc(address) + '</div>';
    if (b.developer) html += '<div class="developer">' + esc(b.developer.name) + '</div>';
    if (b.status) html += '<span class="status-badge">' + esc(b.status) + '</span>';
    html += '<div class="specs-grid">';
    if (b.min_bedrooms || b.max_bedrooms) {
      var beds = b.min_bedrooms === b.max_bedrooms ? b.min_bedrooms : (b.min_bedrooms || '?') + ' a ' + (b.max_bedrooms || '?');
      html += '<div class="spec-item"><div class="spec-value">' + beds + '</div><div class="spec-label">Dormitórios</div></div>';
    }
    if (b.min_area || b.max_area) {
      var area = b.min_area === b.max_area ? b.min_area : (b.min_area || '?') + ' a ' + (b.max_area || '?');
      html += '<div class="spec-item"><div class="spec-value">' + area + '</div><div class="spec-label">Área (m²)</div></div>';
    }
    if (b.stock) html += '<div class="spec-item"><div class="spec-value">' + b.stock + '</div><div class="spec-label">Unidades</div></div>';
    if (b.number_of_floors) html += '<div class="spec-item"><div class="spec-value">' + b.number_of_floors + '</div><div class="spec-label">Andares</div></div>';
    if (b.number_of_towers) html += '<div class="spec-item"><div class="spec-value">' + b.number_of_towers + '</div><div class="spec-label">Torres</div></div>';
    if (b.apts_per_floor) html += '<div class="spec-item"><div class="spec-value">' + b.apts_per_floor + '</div><div class="spec-label">Apts/Andar</div></div>';
    html += '</div></div>';

    /* FEATURES */
    var features = b.features || [];
    if (features.length) {
      html += '<div class="features-section"><h2>Características</h2><div class="features-grid">';
      features.forEach(function(f){
        html += '<div class="feature-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' + esc(f) + '</div>';
      });
      html += '</div></div>';
    }

    /* DESCRIPTION */
    if (b.description) {
      html += '<div class="desc-section"><h2>Descrição</h2><p>' + esc(b.description) + '</p></div>';
    }

    /* DOCUMENTS */
    var docs = b.documents || [];
    if (docs.length) {
      html += '<div class="features-section"><h2>Documentos</h2><div style="display:flex;flex-direction:column;gap:8px">';
      docs.forEach(function(d){
        html += '<a href="' + esc(d.url) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f8f9fb;border-radius:6px;text-decoration:none;color:#1a1a1a;font-size:13px;transition:background .15s" onmouseover="this.style.background=\'#eef2f7\'" onmouseout="this.style.background=\'#f8f9fb\'">';
        html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a3c6e" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        html += esc(d.name || 'Documento');
        html += '</a>';
      });
      html += '</div></div>';
    }
    html += '</div>';

    /* SIDEBAR */
    html += '<div class="sidebar">';
    html += '<div class="sidebar-card">';
    html += '<div class="price-label">' + (b.source === 'caixa' ? '2º Leilão' : 'A partir de') + '</div>';
    html += '<div class="price-value">' + brl(b.price) + '</div>';
    if (b.price2Leilao && b.price2Leilao !== b.price) html += '<div class="price-per-m2">1º Leilão: ' + brl(b.initialBid) + '</div>';
    else if (b.initialBid) html += '<div class="price-per-m2">Avaliado: ' + brl(b.initialBid) + '</div>';
    if (b.situation) html += '<div style="margin-top:6px"><span class="status-badge" style="background:' + (b.situation === 'Ocupado' ? '#fff3cd;color:#856404' : '#d4edda;color:#155724') + '">' + esc(b.situation) + '</span></div>';
    html += '</div>';

    if (b.source === 'caixa') {
      html += '<a class="cta-btn cta-primary" href="' + esc(b.sourceUrl) + '" target="_blank" rel="noopener">Dê seu lance</a>';
    } else if (b.orulo_url) {
      html += '<a class="cta-btn cta-primary" href="' + esc(b.orulo_url) + '" target="_blank" rel="noopener">Ver no Orulo</a>';
    }
    html += '<a class="cta-btn cta-outline" href="catalogo.html">Voltar ao Catálogo</a>';

    /* INFO LIST */
    var infoRows = [];
    if (b.source === 'caixa') {
      if (b.subcategory) infoRows.push(['Tipo', b.subcategory]);
      if (b.bedrooms) infoRows.push(['Quartos', b.bedrooms]);
      if (b.usefulArea) infoRows.push(['Área Privativa', b.usefulArea + ' m²']);
      if (b.totalArea) infoRows.push(['Área Total', b.totalArea + ' m²']);
      if (b.edital) infoRows.push(['Edital', b.edital]);
      if (b.itemNumber) infoRows.push(['Nº do Item', b.itemNumber]);
      if (b.leiloeiro) infoRows.push(['Leiloeiro', b.leiloeiro]);
      if (b.auctionDate) infoRows.push(['1º Leilão', b.auctionDate]);
      if (b.auctionDate2) infoRows.push(['2º Leilão', b.auctionDate2]);
      if (b.matricula) infoRows.push(['Matrícula', b.matricula]);
      if (b.comarca) infoRows.push(['Comarca', b.comarca]);
      if (b.inscricaoImobiliaria) infoRows.push(['Inscrição', b.inscricaoImobiliaria]);
      if (b.fgts) infoRows.push(['FGTS', 'Permitido']);
      if (b.state) infoRows.push(['Estado', b.state]);
      if (b.city) infoRows.push(['Cidade', b.city]);
    } else {
      if (b.finality) infoRows.push(['Finalidade', b.finality]);
      if (b.status) infoRows.push(['Status', b.status]);
      if (b.min_bathrooms) infoRows.push(['Banheiros', b.min_bathrooms + (b.max_bathrooms && b.max_bathrooms !== b.min_bathrooms ? ' a ' + b.max_bathrooms : '')]);
      if (b.min_parking) infoRows.push(['Vagas', b.min_parking + (b.max_parking && b.max_parking !== b.min_parking ? ' a ' + b.max_parking : '')]);
      if (b.address && b.address.area) infoRows.push(['Bairro', b.address.area]);
      if (b.address && b.address.city) infoRows.push(['Cidade', b.address.city]);
      if (b.updated_at) infoRows.push(['Atualizado', b.updated_at]);
    }

    if (infoRows.length) {
      html += '<div class="sidebar-card info-list">';
      infoRows.forEach(function(r){
        html += '<div class="info-row"><span class="ilabel">' + r[0] + '</span><span class="ivalue">' + esc(r[1]) + '</span></div>';
      });
      html += '</div>';
    }

    /* CAIXA PAYMENT INFO */
    if (b.source === 'caixa' && (b.paymentInfo || b.expensesInfo)) {
      html += '<div class="sidebar-card" style="text-align:left">';
      html += '<div style="font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:6px">Condições</div>';
      if (b.paymentInfo) html += '<div style="font-size:12px;color:#555;margin-bottom:4px">' + esc(b.paymentInfo) + '</div>';
      if (b.expensesInfo) html += '<div style="font-size:12px;color:#555">' + esc(b.expensesInfo) + '</div>';
      html += '</div>';
    }

    html += '</div>'; /* sidebar */
    html += '</div>'; /* content-grid */

    main.innerHTML = html;
    document.title = (b.name || 'Empreendimento') + ' — Rei do Apê';

    setupGallery(imgs);
  }

  function renderSuperbid(b) {
    var imgs = b.photos || [];
    var addr = b.location || {};
    var auction = b.auction || {};
    var props = b.properties || {};
    var stages = auction.stages || [];
    var seller = b.seller || {};
    var docs = b.attachments || [];

    var html = '';

    /* BREADCRUMB */
    html += '<div class="breadcrumb">';
    html += '<a href="index.html">Home</a><span class="sep">/</span>';
    if (b.category) { html += '<span>' + esc(b.category) + '</span><span class="sep">/</span>'; }
    if (b.subcategory) { html += '<span>' + esc(b.subcategory) + '</span><span class="sep">/</span>'; }
    if (addr.city) { html += '<span>' + esc(addr.city) + '</span><span class="sep">/</span>'; }
    html += '<span>' + esc(addr.state || '') + '</span>';
    html += '</div>';

    html += '<div class="content-grid">';

    /* LEFT */
    html += '<div>';

    /* GALLERY (inside first column) */
    if (imgs.length) {
      html += '<div class="gallery" id="gallery">';
      html += '<div class="gallery-main" id="gallery-main">';
      html += '<img id="gallery-img" src="' + esc(imgs[0]) + '" alt="' + esc(b.title) + '">';
      if (imgs.length > 1) {
        html += '<button class="gallery-nav prev" onclick="galleryNav(-1)">&#10094;</button>';
        html += '<button class="gallery-nav next" onclick="galleryNav(1)">&#10095;</button>';
      }
      html += '<div class="gallery-count" id="gallery-count">1/' + imgs.length + '</div>';
      html += '</div>';
      html += '<div class="gallery-thumbs" id="gallery-thumbs">';
      for (var i = 0; i < imgs.length; i++) {
        html += '<img src="' + esc(imgs[i]) + '" data-idx="' + i + '"' + (i === 0 ? ' class="active"' : '') + ' onclick="galleryGo(' + i + ')">';
      }
      html += '</div></div>';
    }

    /* SHARE BAR */
    html += '<div class="share-bar">';
    html += '<button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href).then(function(){alert(\'Link copiado!\')})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Compartilhar</button>';
    html += '<a class="share-btn" href="' + esc(b.url) + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="13" x2="21" y2="3"/></svg>Ver no Superbid</button>';
    html += '</div>';
    html += '<div class="info-section">';
    html += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
    html += '<div style="font-size:13px;color:#888;font-weight:600">LOTE ' + esc(String(b.lotNumber)) + '</div>';
    if (addr.city) html += '<div style="font-size:13px;color:#888">📍 ' + esc(addr.city + (addr.state ? '/' + addr.state : '')) + '</div>';
    html += '</div>';
    html += '<h1 style="margin-top:6px">' + esc(b.title || 'Lote ' + b.lotNumber) + '</h1>';
    if (b.seller?.name) html += '<div class="developer">' + esc(b.seller.name) + '</div>';
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">';
    if (b.status?.sold) html += '<span class="status-badge" style="background:#fde8e8;color:#b33">Vendido</span>';
    else if (b.status?.reserved) html += '<span class="status-badge" style="background:#fff3cd;color:#856404">Reservado</span>';
    else if (b.status?.giveYourBid) html += '<span class="status-badge" style="background:#d4edda;color:#155724">Dê seu lance</span>';
    if (b.subcategory) html += '<span class="status-badge">' + esc(b.subcategory) + '</span>';
    if (b.category) html += '<span class="status-badge" style="background:#f0f0f0;color:#555">' + esc(b.category) + '</span>';
    html += '</div>';

    html += '<div class="specs-grid">';
    if (props.areatotal) html += '<div class="spec-item"><div class="spec-value">' + esc(props.areatotal) + ' m²</div><div class="spec-label">Área Total</div></div>';
    if (props.areaconstruida) html += '<div class="spec-item"><div class="spec-value">' + esc(props.areaconstruida) + ' m²</div><div class="spec-label">Área Construída</div></div>';
    if (props.areaterreno) html += '<div class="spec-item"><div class="spec-value">' + esc(props.areaterreno) + ' m²</div><div class="spec-label">Área Terreno</div></div>';
    if (props.banheiros) html += '<div class="spec-item"><div class="spec-value">' + esc(props.banheiros) + '</div><div class="spec-label">Banheiros</div></div>';
    if (props.quartos) html += '<div class="spec-item"><div class="spec-value">' + esc(props.quartos) + '</div><div class="spec-label">Dormitórios</div></div>';
    if (props.vagas) html += '<div class="spec-item"><div class="spec-value">' + esc(props.vagas) + '</div><div class="spec-label">Vagas</div></div>';
    html += '</div></div>';

    /* EVENT PIPELINE STAGES */
    if (stages.length > 1) {
      html += '<div class="features-section"><h2>Etapas do Leilão</h2>';
      stages.forEach(function(s, i){
        var isActive = s.active;
        var borderColor = isActive ? '#1a3c6e' : '#e0e0e0';
        var bgColor = isActive ? '#f0f4ff' : '#f9f9f9';
        html += '<div style="border:1px solid ' + borderColor + ';border-radius:8px;padding:12px;margin-bottom:8px;background:' + bgColor + '">';
        html += '<div style="font-weight:700;font-size:14px;margin-bottom:4px">' + (i+1) + 'º Leilão' + (isActive ? ' <span style="color:#1a3c6e;font-size:11px">● ATIVO</span>' : '') + '</div>';
        if (s.description) html += '<div style="font-size:12px;color:#666;margin-bottom:4px">' + esc(s.description) + '</div>';
        if (s.startDate) html += '<div style="font-size:12px;color:#888">Início: ' + esc(s.startDate) + '</div>';
        if (s.endDate) html += '<div style="font-size:12px;color:#888">Fim: ' + esc(s.endDate) + '</div>';
        if (s.initialBid) html += '<div style="font-size:14px;font-weight:700;color:#1a1a1a;margin-top:4px">Lance: ' + brl(s.initialBid) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    /* TEMPLATE GROUPS (category-specific fields) */
    var tGroups = b.templateGroups || [];
    if (tGroups.length) {
      /* Map group IDs to friendly titles (fallback when API title is empty) */
      var groupTitles = {
        'identificacao': 'Identificação',
        'caracteristicasdoimovel': 'Características do Imóvel',
        'valores': 'Valores',
        'documentos': 'Documentos',
        'descricaodoimovel': 'Descrição do Imóvel',
        'detalhesdoimovel': 'Detalhes do Imóvel',
        'especificacao': 'Especificação',
        'condicoesgerais': 'Condições Gerais',
        'observacoesdevistoria': 'Observações de Vistoria',
        'informacoes': 'Informações',
        'financiamento': 'Financiamento',
        'debitos': 'Débitos',
        'maquina': 'Identificação da Máquina',
        'caracteristicasdomotor': 'Características do Motor',
        'carroceria': 'Carroceria',
        'sistemadetransmissao': 'Sistema de Transmissão',
        'sistemahidraulico': 'Sistema Hidráulico',
        'pneus': 'Pneus',
        'pneusesteirasrolantes': 'Pneus/Esteiras Rolantes',
        'cabinedooperador': 'Cabine do Operador',
        'estacaodooperador': 'Estação do Operador',
        'sistemaeletrico': 'Sistema Elétrico',
        'mecanicageral': 'Mecânica Geral',
        'planosdemanutencaodocumentos': 'Manutenção e Documentos',
        'dimensoesdamaquina': 'Dimensões da Máquina',
        'dimensoes': 'Dimensões',
        'adicionais': 'Adicionais',
        'aparenciageral': 'Aparência Geral',
        'testedefuncionamento': 'Teste de Funcionamento',
        'danosaparentes': 'Danos Aparentes',
        'medidascarroceria': 'Dimensões da Carroceria',
        'pesos': 'Peso',
        'acessorios': 'Acessórios',
        'observacoes': 'Observações',
        'detalhes': 'Detalhes',
        'informacoesextras': 'Informações Extras'
      };
      tGroups.forEach(function(g) {
        var filledProps = (g.properties || []).filter(function(p){ return p.value; });
        var displayTitle = g.title || groupTitles[g.id] || g.id || '';
        var hasDocs = (g.id === 'documentos' || g.id === 'documentacao') && docs.length > 0;
        html += '<div class="expandable"><div class="expandable-header" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')">';
        html += '<h2>' + esc(displayTitle) + '</h2>';
        html += '<span class="expandable-arrow">&#9660;</span>';
        html += '</div><div class="expandable-body' + (filledProps.length || hasDocs ? ' open' : '') + '"><div style="padding-top:12px">';
        if (filledProps.length) {
          html += '<table style="width:100%;font-size:13px;border-collapse:collapse">';
          filledProps.forEach(function(p){
            var label = p.title || p.id;
            html += '<tr><td style="padding:6px 8px;color:#888;white-space:nowrap;vertical-align:top;width:40%">' + esc(label) + '</td>';
            html += '<td style="padding:6px 8px;font-weight:600;color:#1a1a1a">' + esc(p.value) + '</td></tr>';
          });
          html += '</table>';
        }
        if (hasDocs) {
          if (filledProps.length) html += '<div style="border-top:1px solid #eee;margin:8px 0"></div>';
          docs.forEach(function(d){
            html += '<a href="' + esc(d.url) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8f9fb;border-radius:6px;text-decoration:none;color:#1a1a1a;font-size:13px;transition:background .15s;margin-bottom:4px" onmouseover="this.style.background=\'#eef2f7\'" onmouseout="this.style.background=\'#f8f9fb\'">';
            html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a3c6e" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
            html += esc(d.name || 'Documento');
            html += '</a>';
          });
        }
        if (!filledProps.length && !hasDocs) {
          html += '<div style="padding:12px 8px;color:#aaa;font-size:13px;font-style:italic">Sem informações</div>';
        }
        html += '</div></div></div>';
      });
    }

    /* SECURITY ALERT */
    html += '<div class="security-alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div><strong>Alerta de Segurança</strong><br>Não enviamos boletos por WhatsApp, e-mail, SMS ou redes sociais. Pague apenas na plataforma. Receba um boleto ou pedido fornece pela plataforma. Não pague contatos por e-mail. Em caso de dúvida, ligue: +55 (11) 4700-1406.</div></div>';

    /* DESCRIPTION */
    if (b.description) {
      html += '<div class="desc-section"><h2>Descrição</h2><div style="font-size:14px;line-height:1.7;color:#444">' + b.description + '</div></div>';
    }

    /* ATTACHMENTS (merged into documentos group above, skip if already rendered) */
    var hasDocGroup = tGroups.some(function(g){ return (g.id === 'documentos' || g.id === 'documentacao') && docs.length > 0; });
    if (docs.length && !hasDocGroup) {
      html += '<div class="expandable"><div class="expandable-header" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')">';
      html += '<h2>Documentação</h2>';
      html += '<span class="expandable-arrow">&#9660;</span>';
      html += '</div><div class="expandable-body open"><div style="display:flex;flex-direction:column;gap:8px;padding-top:12px">';
      docs.forEach(function(d){
        html += '<a href="' + esc(d.url) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f8f9fb;border-radius:6px;text-decoration:none;color:#1a1a1a;font-size:13px;transition:background .15s" onmouseover="this.style.background=\'#eef2f7\'" onmouseout="this.style.background=\'#f8f9fb\'">';
        html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a3c6e" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        html += esc(d.name || 'Documento');
        html += '</a>';
      });
      html += '</div></div></div>';
    }

    /* BID HISTORY PLACEHOLDER */
    html += '<div class="expandable"><div class="expandable-header" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')">';
    html += '<h2>Histórico de lances</h2>';
    html += '<span class="expandable-arrow">&#9660;</span>';
    html += '</div><div class="expandable-body"><div style="padding:16px;text-align:center;color:#888;font-size:13px">';
    html += 'Total: ' + (b.bids?.totalBids || 0) + ' lance(s) &mdash; ' + (b.bids?.totalBidders || 0) + ' participante(s)';
    html += '</div></div></div>';

    html += '</div>';

    /* SIDEBAR */
    html += '<div class="sidebar">';

    /* COUNTDOWN */
    if (auction.endDate) {
      html += '<div class="countdown-card" id="countdown-card">';
      html += '<div class="label">Encerra em</div>';
      html += '<div class="countdown-timer" id="countdown-timer">';
      html += '<div class="unit"><div class="num" id="cd-hours">--</div><div class="unit-label">horas</div></div>';
      html += '<div class="unit"><div class="num" id="cd-mins">--</div><div class="unit-label">minutos</div></div>';
      html += '<div class="unit"><div class="num" id="cd-secs">--</div><div class="unit-label">segundos</div></div>';
      html += '</div>';
      html += '<div class="countdown-info">Encerramento: <strong>' + esc(auction.endDate) + '</strong></div>';
      if (auction.startDate) html += '<div class="countdown-info">Abertura: <strong>' + esc(auction.startDate) + '</strong></div>';
      html += '</div>';
    }

    /* STATS ROW */
    html += '<div class="sidebar-card" style="display:flex;justify-content:space-around;text-align:center;padding:12px">';
    html += '<div><div style="font-size:18px;font-weight:700">' + (b.visits || 0) + '</div><div style="font-size:11px;color:#888">Visitas</div></div>';
    html += '<div><div style="font-size:18px;font-weight:700">' + (b.bids?.totalBidders || 0) + '</div><div style="font-size:11px;color:#888">Participantes</div></div>';
    html += '<div><div style="font-size:18px;font-weight:700">' + (b.bids?.totalBids || 0) + '</div><div style="font-size:11px;color:#888">Lances</div></div>';
    html += '</div>';

    /* PRICE CARD */
    html += '<div class="sidebar-card">';
    html += '<div class="price-label">' + (b.bids?.totalBids ? 'Último lance' : 'Lance') + '</div>';
    html += '<div class="price-value">' + brl(b.price) + '</div>';
    if (b.directSaleValue && b.directSaleValue !== b.price) html += '<div style="color:#1a3c6e;font-size:13px;font-weight:600;margin-top:4px">Venda direta: ' + brl(b.directSaleValue) + '</div>';
    if (b.referenceValue && b.referenceValue !== b.price) html += '<div style="color:#888;font-size:12px;margin-top:2px">Valor referência: ' + brl(b.referenceValue) + '</div>';
    if (b.reservedPrice && b.reservedPrice !== b.price) html += '<div style="color:#888;font-size:12px;margin-top:2px">Reservado: ' + brl(b.reservedPrice) + '</div>';
    if (b.bids?.incrementFormatted) html += '<div style="color:#888;font-size:12px;margin-top:4px">Incremento: ' + esc(b.bids.incrementFormatted) + '</div>';
    if (b.groupOffer?.acceptProposal) html += '<div style="background:#d4edda;color:#155724;font-size:11px;padding:4px 8px;border-radius:4px;margin-top:8px;text-align:center">Aceita proposta' + (b.groupOffer.commissionPercent ? ' — Comissão: ' + b.groupOffer.commissionPercent + '%' : '') + '</div>';
    html += '</div>';

    html += '<a class="cta-btn cta-primary" href="' + esc(b.url) + '" target="_blank" rel="noopener" style="background:#9333ea">HABILITE-SE</a>';
    html += '<a class="cta-btn cta-outline" href="catalogo.html">Voltar ao Catálogo</a>';

    /* SELLER / ORGANIZER / AUCTIONEER */
    html += '<div class="sidebar-card" style="text-align:left">';
    if (seller.company) html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555;flex-shrink:0">🏢</div><div><div style="font-size:11px;color:#888">Empresa</div><div style="font-size:13px;font-weight:600">' + esc(seller.company) + '</div></div></div>';
    if (seller.name && seller.name !== seller.company) html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555;flex-shrink:0">👤</div><div><div style="font-size:11px;color:#888">Vendido por</div><div style="font-size:13px;font-weight:600">' + esc(seller.name) + '</div></div></div>';
    if (b.stores && b.stores.length) {
      var mainStore = b.stores[0];
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">';
      if (mainStore.logo) html += '<img src="' + esc(mainStore.logo) + '" style="width:36px;height:36px;border-radius:6px;object-fit:contain;background:#f0f0f0">';
      else html += '<div style="width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555;flex-shrink:0">📋</div>';
      html += '<div><div style="font-size:11px;color:#888">Organizado por</div><div style="font-size:13px;font-weight:600">' + esc(mainStore.name) + '</div></div></div>';
    }
    if (auction.auctioneer) html += '<div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555;flex-shrink:0">🔨</div><div><div style="font-size:11px;color:#888">Leiloeiro</div><div style="font-size:13px;font-weight:600">' + esc(auction.auctioneer) + '</div></div></div>';
    if (b.manager) html += '<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div style="width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555;flex-shrink:0">👤</div><div><div style="font-size:11px;color:#888">Gerente</div><div style="font-size:13px;font-weight:600">' + esc(b.manager) + '</div></div></div>';
    html += '</div>';

    /* COMMERCIAL CONDITIONS */
    if (b.commercialCondition) {
      var cc = b.commercialCondition;
      var ccItems = [];
      if (cc.allowsCreditCard) ccItems.push('Aceita cartão de crédito');
      if (cc.maxInstallments) ccItems.push('Até ' + cc.maxInstallments + 'x parcelas');
      if (cc.transactionLimit) ccItems.push('Limite: ' + brl(cc.transactionLimit));
      if (ccItems.length) {
        html += '<div class="sidebar-card" style="text-align:left">';
        html += '<div style="font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:6px">Condições Comerciais</div>';
        ccItems.forEach(function(item){
          html += '<div style="font-size:12px;color:#555;padding:3px 0">• ' + esc(item) + '</div>';
        });
        html += '</div>';
      }
    }

    /* CONTACT */
    html += '<div class="contact-section">';
    html += '<h3>Dúvidas e contato</h3>';
    html += '<p>Tire dúvidas sobre a plataforma Superbid ou faça contato direto com o vendedor para tirar suas dúvidas.</p>';
    if (seller.phones && seller.phones.length) html += '<p style="margin-top:6px">Tel: <a href="tel:' + esc(seller.phones[0].replace(/\D/g,'')) + '">' + esc(seller.phones[0]) + '</a></p>';
    html += '</div>';

    html += '</div>';
    html += '</div>';

    main.innerHTML = html;
    document.title = (b.title || 'Lote') + ' — Rei do Apê';

    setupGallery(imgs);
    if (auction.endDate) setupCountdown(auction.endDate);
  }

  function setupGallery(imgs) {
    window.galleryGo = function(idx) {
      var img = document.getElementById('gallery-img');
      var thumbs = document.querySelectorAll('.gallery-thumbs img');
      img.src = imgs[idx];
      document.getElementById('gallery-count').textContent = (idx + 1) + '/' + imgs.length;
      for (var t = 0; t < thumbs.length; t++) thumbs[t].classList.toggle('active', t === idx);
      window._galleryIdx = idx;
    };
    window._galleryIdx = 0;
    window.galleryNav = function(dir) {
      var next = (window._galleryIdx + dir + imgs.length) % imgs.length;
      window.galleryGo(next);
    };
    var mainImg = document.getElementById('gallery-main');
    if (mainImg) {
      mainImg.addEventListener('click', function(e) {
        if (e.target.classList.contains('gallery-nav')) return;
        var img = document.getElementById('gallery-img');
        img.classList.toggle('zoomed');
        mainImg.style.cursor = img.classList.contains('zoomed') ? 'zoom-out' : 'zoom-in';
      });
    }
  }

  function brl(v){ return v ? 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}) : 'Consulte'; }
  function esc(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function setupCountdown(endDateStr) {
    var h = document.getElementById('cd-hours');
    var m = document.getElementById('cd-mins');
    var s = document.getElementById('cd-secs');
    if (!h || !m || !s) return;
    var endMs = Date.parse(endDateStr);
    if (isNaN(endMs)) return;
    function tick() {
      var diff = Math.max(0, endMs - Date.now());
      var hours = Math.floor(diff / 3600000);
      var mins = Math.floor((diff % 3600000) / 60000);
      var secs = Math.floor((diff % 60000) / 1000);
      h.textContent = String(hours).padStart(2, '0');
      m.textContent = String(mins).padStart(2, '0');
      s.textContent = String(secs).padStart(2, '0');
      if (diff > 0) requestAnimationFrame(tick);
    }
    tick();
    setInterval(tick, 1000);
  }
})();
</script>
